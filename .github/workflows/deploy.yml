name: Publish CarryLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract CarryLab website
        run: |
          mkdir -p public
          python3 - <<'PY'
          import glob,zipfile,sys
          files=glob.glob("carrylab-github-pages*.zip")
          if len(files)!=1:
              sys.exit("Expected one CarryLab ZIP archive")
          with zipfile.ZipFile(files[0]) as z:
              z.extractall("public")
          PY
          test -s public/index.html
          echo "CarryLab index.html found; website is ready to publish."
      - name: Add version 0.3 coaching module
        run: |
          cp coach-v03.js public/coach-v03.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("</body>", '<script src="coach-v03.js"></script></body>')
          p.write_text(s,encoding="utf-8")
          PY
          test -s public/coach-v03.js
      - name: Install independent deep analyzer
        run: |
          cp deep-analyzer.html public/deep-analyzer.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("</body>", '<div style="position:fixed;right:18px;bottom:18px;z-index:9999;background:#b6ed65;padding:12px 17px;border-radius:12px;box-shadow:0 8px 28px #0008"><a href="deep-analyzer.html" style="color:#122118;font-weight:800;text-decoration:none">Новый анализ матча v0.4 ↗</a></div></body>')
          p.write_text(s,encoding="utf-8")
          PY
          test -s public/deep-analyzer.html
      - name: Add OpenDota + DOTABUFF integration
        run: |
          cp data-hub.html public/data-hub.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          link='<a href="data-hub.html" style="position:fixed;right:18px;bottom:72px;z-index:9999;background:#172d25;color:#c7f477;padding:12px 17px;border:1px solid #8ebf65;border-radius:12px;font-weight:800;text-decoration:none">OpenDota + DOTABUFF ↗</a>'
          s=s.replace("</body>",link+"</body>")
          p.write_text(s,encoding="utf-8")
          PY
          test -s public/data-hub.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
