name: Publish CarryLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract CarryLab website
        run: |
          mkdir -p public
          python3 - <<'PY'
          import glob,zipfile,sys
          files=glob.glob("carrylab-github-pages*.zip")
          if len(files)!=1:
              sys.exit("Expected one CarryLab ZIP archive")
          with zipfile.ZipFile(files[0]) as z:
              z.extractall("public")
          PY
          test -s public/index.html
          echo "CarryLab index.html found; website is ready to publish."
      - name: Add version 0.3 coaching module
        run: |
          cp coach-v03.js public/coach-v03.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("</body>", '<script src="coach-v03.js"></script></body>')
          p.write_text(s,encoding="utf-8")
          PY
          test -s public/coach-v03.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
